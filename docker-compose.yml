version: '3.8'

services:
  coursegen:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: coursegen:latest
    container_name: coursegen-app
    
    # Environment variables
    environment:
      - PYTHONUNBUFFERED=1
      - COURSEGEN_COURSES_JSON=/app/data/textbooks/courses.json
      - COURSEGEN_CACHE_DIR=/app/.cache/coursegen
      - CHROMA_PERSIST_DIR=/app/OUTPUT_DATA2/emdeddings
      - OMP_NUM_THREADS=2
      # Add your API keys here or use .env file
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      # - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    
    # Optional: Load environment from .env file
    env_file:
      - .env
    
    # Volume mounts for data persistence
    volumes:
      # Persistent storage for ChromaDB embeddings (survives container rebuilds)
      - ./OUTPUT_DATA2:/app/OUTPUT_DATA2
      # Persistent storage for generation caches (survives container rebuilds)
      - ./.cache:/app/.cache
      # Persistent storage for data directories
      - ./data:/app/data
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '0.5'
    
    # Health check - verify ChromaDB embeddings directory exists
    healthcheck:
      test: ["CMD", "test", "-d", "/app/OUTPUT_DATA2/emdeddings"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Default command - run question generation (can be overridden)
    command: ["--theory-per-request", "10", "--calc-per-request", "10", "--request-delay", "2"]
    
    # Interactive mode
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped

  # Optional: Add a service for question generation with specific configuration
  coursegen-questions:
    extends: coursegen
    container_name: coursegen-questions
    command: ["--generate-questions"]
    profiles:
      - questions
    
  # Optional: Add a service for outline generation
  coursegen-outlines:
    extends: coursegen
    container_name: coursegen-outlines
    command: ["--department_from", "EEE 315"]
    profiles:
      - outlines

# Optional: Define networks
networks:
  default:
    name: coursegen-network
    driver: bridge