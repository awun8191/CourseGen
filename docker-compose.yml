services:
  coursegen:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${ECR_REGISTRY:-coursegen}:latest
    container_name: coursegen-app
    environment:
      - PYTHONUNBUFFERED=1
      - COURSEGEN_COURSES_JSON=/app/data/textbooks/courses.json
      - COURSEGEN_CACHE_DIR=/app/output_data/cache
      - CHROMA_PERSIST_DIR=/app/output_data/vector_database
      - OMP_NUM_THREADS=2
      - WORKERS=2
    env_file:
      - .env
    volumes:
      - ./output_data:/app/output_data
      - ./data:/app/data
    mem_limit: 8g
    cpus: "2.0"
    healthcheck:
      test: ["CMD", "test", "-d", "/app/output_data/vector_database"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["--theory-per-request", "10", "--calc-per-request", "5", "--request-delay", "2"]
    stdin_open: true
    tty: true
    restart: unless-stopped

  coursegen-questions:
    extends: coursegen
    container_name: coursegen-questions
    command: ["--generate-questions"]
    profiles:
      - questions

  coursegen-outlines:
    extends: coursegen
    container_name: coursegen-outlines
    command: ["--department_from", "EEE 315"]
    profiles:
      - outlines

networks:
  default:
    name: coursegen-network
    driver: bridge
